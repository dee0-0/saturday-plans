name: Deploy shared plan API

on:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - ".github/workflows/deploy-plan-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Show Worker URL
        if: steps.deploy.outputs.deployment-url != ''
        run: echo "Shared plan API: ${{ steps.deploy.outputs.deployment-url }}"
