name: Deploy shared plan API

on:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - ".github/workflows/deploy-plan-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional: a TMDB API read access token (or v3 API key) for movie posters.
      # Empty when the repository secret doesn't exist; the movie page then lets you type titles.
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          # Uploads TMDB_TOKEN as a Worker secret only when it is set, so the deploy works without it.
          secrets: ${{ env.TMDB_TOKEN != '' && 'TMDB_TOKEN' || '' }}
      - name: Show Worker URL
        if: steps.deploy.outputs.deployment-url != ''
        run: 'echo "Shared plan API: ${{ steps.deploy.outputs.deployment-url }}"'
